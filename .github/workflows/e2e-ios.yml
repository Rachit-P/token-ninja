# End-to-end tests for the native iOS app: a simulator build driven by Maestro on a
# macOS runner. See app/e2e/ios.
name: E2E iOS (Simulator)

on:
  push:
  pull_request:

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Start API
        run: ./scripts/start-api-for-e2e.sh

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Generate native iOS project
        working-directory: app
        run: npx expo prebuild --platform ios --clean

      - name: Build for simulator
        working-directory: app/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME"
          # Release embeds the JS bundle, so no Metro server is needed during the test.
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet

      - name: Boot simulator and install app
        working-directory: app/ios
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        working-directory: app
        run: maestro --device "$SIM_UDID" test e2e/ios --format junit --output maestro-report.xml

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-ios
          path: |
            app/maestro-report.xml
            ~/.maestro/tests
            api/e2e-api.log
          retention-days: 7
